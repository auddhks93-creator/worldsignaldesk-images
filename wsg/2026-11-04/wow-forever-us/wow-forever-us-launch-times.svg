<text x="89" y="99" font-family="Arial, sans-serif" font-size="20" fill="#e8c89c" font-weight="700" letter-spacing="2">US LAUNCH GUIDE</text>
<text x="70" y="185" font-family="Georgia,serif" font-size="60" fill="#f5f5f1" font-weight="700">World of Warcraft</text>
<text x="70" y="265" font-family="Georgia,serif" font-size="90" fill="url(#gold)" font-weight="700">Forever</text>
<text x="74" y="326" font-family="Arial,sans-serif" font-size="27" fill="#cfdee8">One global launch. Four American clocks.</text>
