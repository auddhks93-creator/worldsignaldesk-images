<title id="title">GTA 6 U.S. pre-load times across four time zones and storage guide</title>
<desc id="desc">An original high-contrast infographic comparing Xbox Series X and S U.S. Nov 9 pre-load times Eastern 7 PM, Central 6 PM, Mountain 5 PM and Pacific 4 PM; PS5 begins Nov 10 at local midnight; up to 212 GB available storage; code-in-box Nov 12 and game launch Nov 19.</desc>
