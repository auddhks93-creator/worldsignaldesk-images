<text x="202" y="584" fill="#163a48" font-family="Georgia,serif" font-size="34">The catch: an outpost is not a city.</text>
<text x="204" y="628" fill="#365766" font-size="22">Manta lets owners build ocean outposts. Turning them into cities</text>
<text x="204" y="661" fill="#365766" font-size="22">requires the paid expansion's Mercantile culture.</text>
<text x="76" y="770" font-size="17" fill="#d1dfdc">Original editorial illustration  ·  Based on Paradox / Triumph release and patch notes  ·  Not gameplay footage</text>
