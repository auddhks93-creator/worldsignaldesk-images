<g font-family="Arial,Helvetica,sans-serif">
<text x="76" y="75" font-size="21" font-weight="700" letter-spacing="5" fill="#e0aa70">WORLD SIGNAL GAMING / BUYER'S CHART</text>
<text x="74" y="152" font-family="Georgia,serif" font-size="58" fill="#f7eee0">One game. Three different offers.</text>
<text x="76" y="198" font-size="24" fill="#c8dbd5">Age of Wonders 4  ·  U.S.  ·  November 2026</text>
<path d="M76 231 H1364" stroke="#7cb7b3" stroke-opacity=".65" stroke-width="2"/>
<g transform="translate(76 273)">
<circle cx="43" cy="43" r="42" fill="#e3b67d"/><text x="43" y="55" text-anchor="middle" font-family="Georgia,serif" font-size="34" fill="#122e38">01</text>
<text x="110" y="29" font-size="17" font-weight="700" letter-spacing="2" fill="#efccaa">LIMITED-TIME ACCESS</text>
<text x="110" y="71" font-family="Georgia,serif" font-size="31" fill="#fffaf2">Base-game trial</text>
<text x="110" y="108" font-size="19" fill="#cce1de">Steam + Xbox  |  Nov 5–9</text>
<text x="110" y="140" font-size="18" fill="#e0ae7b">Not free to keep</text>
</g>
<path d="M496 280 V511" stroke="#a7c9c3" stroke-dasharray="4 11" opacity=".48"/>
<g transform="translate(524 273)">
<circle cx="43" cy="43" r="42" fill="#9ccbc6"/><text x="43" y="55" text-anchor="middle" font-family="Georgia,serif" font-size="34" fill="#0a3341">02</text>
<text x="110" y="29" font-size="17" font-weight="700" letter-spacing="2" fill="#c4e9e2">BASE-GAME OWNERS</text>
<text x="110" y="71" font-family="Georgia,serif" font-size="31" fill="#fffaf2">Manta update</text>
<text x="110" y="108" font-size="19" fill="#cce1de">Trade Routes + sea outposts</text>
<text x="110" y="140" font-size="18" fill="#a8e0d2">Free update</text>
</g>
<path d="M944 280 V511" stroke="#a7c9c3" stroke-dasharray="4 11" opacity=".48"/>
<g transform="translate(971 273)">
<circle cx="43" cy="43" r="42" fill="#e8b97e"/><text x="43" y="55" text-anchor="middle" font-family="Georgia,serif" font-size="34" fill="#122e38">03</text>
<text x="110" y="29" font-size="17" font-weight="700" letter-spacing="2" fill="#efccaa">SEPARATE DLC</text>
<text x="110" y="71" font-family="Georgia,serif" font-size="31" fill="#fffaf2">The Silver Seas</text>
<text x="110" y="108" font-size="19" fill="#cce1de">Mercantile sea cities + more</text>
<text x="110" y="140" font-size="18" fill="#e8b97e">$24.99 suggested U.S. price</text>
</g>
<path d="M76 493 H1364" stroke="#7cb7b3" stroke-opacity=".65" stroke-width="2"/>
<rect x="76" y="529" width="1288" height="192" rx="5" fill="url(#sand)"/>
