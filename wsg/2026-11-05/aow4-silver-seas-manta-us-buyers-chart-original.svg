<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="800" viewBox="0 0 1440 800" role="img" aria-labelledby="t d">
<title id="t">Age of Wonders 4: three different November 2026 offers</title>
<desc id="d">Original World Signal Gaming nautical editorial chart: November 5–9 temporary base-game trial on Steam and Xbox; free Manta Update for existing owners; separate $24.99 Silver Seas expansion. Ocean outposts are free; Mercantile sea cities require the paid expansion.</desc>
<defs>
<linearGradient id="sea" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071e2d"/><stop offset=".62" stop-color="#10394a"/><stop offset="1" stop-color="#0f4e5b"/></linearGradient>
<pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse"><path d="M56 0H0V56" fill="none" stroke="#b3d7d1" opacity=".08" stroke-width="1"/></pattern>
<linearGradient id="sand" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#efdfbf"/><stop offset="1" stop-color="#f7eedc"/></linearGradient>
</defs>
<rect width="1440" height="800" fill="url(#sea)"/>
<rect width="1440" height="800" fill="url(#grid)"/>
